name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - schema/**
      - Makefile
      - src/**
      - test/**
      - bindings/**
      - Cargo.toml
      - Cargo.lock
      - tree-sitter.json
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - schema/**
      - Makefile
      - src/**
      - test/**
      - bindings/**
      - Cargo.toml
      - Cargo.lock
      - tree-sitter.json
      - .github/workflows/ci.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  generate:
    name: Verify generated sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.27.0
      - name: Regenerate parsers and schemas with QuickJS
        run: make generate
      - name: Check generated sources
        run: git diff --exit-code -- src schema

  test:
    name: Test parsers
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.27.0
      - name: Run parser tests
        run: tree-sitter test
      - name: Run Rust tests
        uses: tree-sitter/parser-test-action/rust@v2
      - name: Set up test suite
        shell: bash
        run: |-
          printf '%s\n' examples/*.yaml > "$RUNNER_TEMP/test-files"
          while read -r file; do
            printf '%s\n' "$file" >> "$RUNNER_TEMP/test-files"
            if [[ -f ${file/in.yaml/error} ]]; then
              printf '%s\n' "$file" >> "$RUNNER_TEMP/invalid-files"
            fi
          done < <(find -L examples/yaml-test-suite/name -name in.yaml)
      - name: Parse test suite
        uses: tree-sitter/parse-action@v4
        with:
          files-list: ${{runner.temp}}/test-files
          invalid-files-list: ${{runner.temp}}/invalid-files
